name: Build and Push Docker Image

on:
  push:
    branches:
      - developer
      - qa
      - prod

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gerador-relatorio-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Definir tag da imagem
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "developer" ]; then
            echo "tag=dev" >> $GITHUB_OUTPUT
          elif [ "${GITHUB_REF_NAME}" = "qa" ]; then
            echo "tag=qa" >> $GITHUB_OUTPUT
          elif [ "${GITHUB_REF_NAME}" = "prod" ]; then
            echo "tag=prod" >> $GITHUB_OUTPUT
          else
            echo "tag=manual" >> $GITHUB_OUTPUT
          fi

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}